name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One checkout. go.mod requires the modules below this one by version, so
      # this job resolves them the way anyone depending on this module does --
      # which is the point of running it: a green run says the published
      # dependencies are enough to build and test this commit.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Unit, acceptance and architecture suites, plus the runnable examples in
      # the schema package. -count=1 defeats the test result cache, so a green
      # run always reflects the commit it ran on. -coverpkg is needed because
      # the suites live outside the packages they exercise.
      - name: Test
        run: go test -count=1 -coverpkg=./... ./...

      # Correctness under concurrency is not established by ordinary tests
      # passing, and the transports to come are concurrent by nature.
      - name: Race
        run: go test -race -count=1 ./...

      # Generated code is checked in, so a description changed without a
      # regeneration is caught here as well as by the drift test -- this step
      # also fails if a go:generate directive itself has stopped working.
      - name: Generated code
        run: |
          go generate ./...
          git diff --exit-code

      # The examples must remain runnable programs, not only test fixtures.
      - name: Examples
        run: go run ./examples/cmd/webdemo

  # The AMQP adapters are the one part of this module that ordinary tests
  # cannot establish: what the port does is covered against the in-process
  # broker, but what the adapters themselves do -- the flags they pass, the
  # field table they write, whether cancelling a consumer really stops the
  # broker sending -- needs a broker. Those tests skip without an address, and
  # a skipped test is not evidence, so this job is where the evidence comes
  # from.
  #
  # A separate job, so a broker that will not start blocks this and not the
  # suite that needs nothing.
  broker:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          check-latest: true

      # -run selects them by name so the job says what it established rather
      # than running the whole suite again with one variable set.
      - name: AMQP 0-9-1 against a broker
        env:
          EFFECT_GOLANG_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
        run: >-
          go test -count=1 -v
          -run 'CrossesARealBroker|StoppingEarlyStopsTheBroker'
          ./test/acceptance/
